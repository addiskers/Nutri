server_tokens off;

# Rate-limit zones (per-IP)
limit_req_zone $binary_remote_addr zone=uat_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=uat_upload_limit:10m rate=20r/m;
limit_req_status 429;

upstream uat-backend {
    server uat-backend:8000;
}

upstream uat-frontend {
    server uat-frontend:8080;
}

# HTTPS only - no HTTP port exposed externally
server {
    listen 8443 ssl;
    http2 on;
    server_name uatnutrieyeq.zyduswellness.com;

    # SSL Configuration (same certificates as production)
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://uatnutrieyeq.zyduswellness.com; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Max upload size (for product images)
    client_max_body_size 50M;

    # Auth endpoints — tight per-IP limit (edge layer in addition to SlowAPI)
    location /api/auth/ {
        limit_req zone=uat_auth_limit burst=5 nodelay;
        proxy_pass http://uat-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Upload/extraction endpoints — looser but still capped
    location ~ ^/api/(coa|products)/extract {
        limit_req zone=uat_upload_limit burst=10 nodelay;
        proxy_pass http://uat-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Other API requests -> UAT backend
    location /api/ {
        proxy_pass http://uat-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Frontend -> UAT React app
    location / {
        proxy_pass http://uat-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
